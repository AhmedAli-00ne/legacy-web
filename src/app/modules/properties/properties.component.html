<section class="properties-page">
  <h2 style="margin-top: 4rem; color: #fff">Find your place</h2>

  <div class="filters">
    <select [(ngModel)]="selectedCountry">
      <option value="">Country</option>
      <option *ngFor="let country of countries" [value]="country">
        {{ country }}
      </option>
    </select>

    <select [(ngModel)]="selectedCity">
      <option value="">City</option>
      <option *ngFor="let city of cities" [value]="city">{{ city }}</option>
    </select>

    <select [(ngModel)]="selectedProject">
      <option value="">Projects</option>
      <option *ngFor="let project of projects" [value]="project">
        {{ project }}
      </option>
    </select>

    <select [(ngModel)]="selectedType">
      <option value="">Property Type</option>
      <option *ngFor="let type of propertyTypes" [value]="type">
        {{ type }}
      </option>
    </select>
  </div>

  <div class="grid-container">
    <div class="property-grid">
      <div class="property-card"  *ngFor="let property of filteredProperties">
        <img (click)="openModal(property.floorPlans)" [src]="property.image" alt="{{ property.name }}" />
        <h3>{{property.project}}</h3>
        <h4>{{ property.name }}</h4>
        
        <p>{{ property.location }}</p>
        
      </div>
    </div>

    <div class="pagination">
      <button (click)="prevPage()" [disabled]="currentPage === 1">&lt;</button>
      <button
        *ngFor="let page of totalPagesArray"
        [class.active]="page === currentPage"
        (click)="goToPage(page)"
      >
        {{ page }}
      </button>
      <button (click)="nextPage()" [disabled]="currentPage === totalPages">
        &gt;
      </button>
    </div>
  </div>
  <span></span>
</section>
<app-unit-type-modal
  *ngIf="showModal"
  [floorPlans]="selectedFloorPlans"
  (closeModal)="showModal = false"
></app-unit-type-modal>
