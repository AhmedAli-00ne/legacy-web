<header class="header">
  <div class="logo">
    <img
      src="../../../../assets/images/Logo legacy.svg"
      alt="Logo Icon"
      class="logo-icon"
    />
    <img
      src="../../../../assets/images/Logo text legacy.svg"
      alt="Logo Text"
      class="logo-text"
    />
  </div>

  <div class="right-side">
    <a class="book-now" href="#">BOOK NOW</a>

      <div [class.active]="menuOpen"></div>
      <div [class.active]="menuOpen"></div>
      <div [class.active]="menuOpen"></div>

      </ul>

        <p>
          <strong>Legacy</strong><br />
          20 Aisha Al Taimoria Street – Garden City – Beside Four Seasons – Nile
          Plaza<br />
          Hotel 1st floor, No.(5)<br />
          Phone: +202 27929892 / +202 27929893<br />
