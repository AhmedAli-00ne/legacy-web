<div class="modal-container">
  <div class="layout-content-container p-4">
    <h2 class="text-white text-[28px] font-bold text-center pb-3 pt-5">
      Floor Plans
    </h2>

    <!-- Top-Level Categories -->
    <div class="flex gap-4 px-4 pb-4 flex-wrap justify-center">
      <div class="relative" *ngFor="let plan of floorPlans; let i = index">
        <div
          class="cursor-pointer text-white text-sm font-bold px-3 py-2 border rounded-full flex items-center gap-1"
          [ngClass]="{
            'bg-white text-black': i === activeCategoryIndex,
            'bg-[#2c2c2c]': i !== activeCategoryIndex
          }"
          (click)="selectCategory(i)"
        >
          {{ plan.name }}
          <span
            class="ml-1"
            (click)="toggleDropdown(i); $event.stopPropagation()"
            style="cursor: pointer"
          >
            ▼
          </span>
        </div>

        <!-- Dropdown Types -->
        <div
          class="dropdown-menu"
          *ngIf="i === dropdownOpenIndex && plan.types"
        >
          <a
            *ngFor="let type of plan.types; let j = index"
            (click)="selectType(i, j)"
          >
            {{ type.name }}
          </a>
        </div>
      </div>
    </div>

    <!-- Image Display -->
    <div class="flex w-full grow p-4 justify-center">
      <div
        class="w-full max-w-full bg-center bg-no-repeat bg-contain rounded-xl aspect-[3/2]"
        [ngStyle]="{
          'background-image': 'url(' + activeImageUrl + ')'
        }"
      ></div>
    </div>

    <p class="text-white text-base font-normal text-center px-4 pt-1 pb-3">
      {{ activeTypeName }}
    </p>

    <div class="flex px-4 py-3 justify-center">
      <button class="btn-dark" (click)="close()">Close</button>
    </div>
  </div>
</div>
