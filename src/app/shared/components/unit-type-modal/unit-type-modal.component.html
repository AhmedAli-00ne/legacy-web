<div class="modal-container">
  <div class="layout-content-container">
    <h2 class="text-white text-[28px] font-bold text-center pb-3 pt-5">
      Floor Plans
    </h2>

    <!-- Main Tabs -->
    <div class="flex border-b border-[#4d4d4d] px-4 gap-8 pb-3 overflow-x-auto">
      <a
        *ngFor="let plan of floorPlans; let i = index"
        class="flex flex-col items-center justify-center pb-[13px] pt-4 cursor-pointer"
        [ngClass]="{
          'border-b-[3px] border-b-white text-white': i === activeIndex,
          'border-b-[3px] border-b-transparent text-[#adadad]':
            i !== activeIndex
        }"
        (click)="selectTab(i)"
      >
        <p class="text-sm font-bold tracking-[0.015em]">{{ plan.name }}</p>
      </a>
    </div>

    <!-- Subtype Dropdown -->
    <div class="flex px-4 py-3 justify-start" *ngIf="activePlan?.types?.length">
  <select
  class="bg-[#2a2a2a] text-white text-sm font-semibold px-4 py-3 rounded-lg border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 hover:bg-[#333] transition duration-200"
    [(ngModel)]="activeTypeIndex"
    >
    <option [ngValue]="-1"> Select {{activePlan?.name}} . .   </option>
  <option 
  *ngFor="let type of activePlan.types; let j = index"
  [ngValue]="j"
  >
  {{ type.name }}
</option>
  </select>
</div>




    <!-- Image Display -->
    <div class="flex w-full grow p-4">
      <div
        class="w-full bg-center bg-no-repeat bg-contain rounded-xl aspect-[3/2]"
        [ngStyle]="{
          'background-image': 'url(' + activeImageUrl + ')'
        }"
      ></div>
    </div>

    <p class="text-white text-base font-normal text-center px-4 pt-1 pb-3">
      {{ activeTypeName }}
    </p>

    <div class="flex px-4 py-3 justify-center">
      <button class="btn-dark" (click)="close()">Close</button>
    </div>
  </div>
</div>
